kind: Deployment
apiVersion: apps/v1
metadata:
  name: frontend-nextjs
  labels:
    app: frontend-nextjs
spec:
  selector:
    matchLabels:
      app: frontend-nextjs
  replicas: 1
  template:
    metadata:
      labels:
        app: frontend-nextjs
    spec:
      containers:
      - image: rohitkalyan18/qrcode-nextjs-frontend:sha-c185c5e2228081e67d09e5807c2d9b166315c9e8
        name: frontend-nextjs
        ports:
        - containerPort: 3000
        env:
        - name: API_URL
          valueFrom:
            configMapKeyRef:
              name: api-url
              key: api_url